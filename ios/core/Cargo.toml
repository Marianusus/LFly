# LFly for iPhone: the Rust core the SwiftUI app calls through UniFFI. It reuses the desktop's
# lfly-yt (YouTube Music, streams, lyrics); the interface, playback and system integration are
# Swift. Built by ../build-core.sh into an XCFramework plus Swift bindings.
[package]
name = "lfly-ios"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "lfly_ios"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dependencies]
lfly-yt = { path = "../../desktop/crates/lfly-yt" }
uniffi = { version = "0.29", features = ["tokio", "cli"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
log = "0.4"
serde_json = "1"
thiserror = "2"

[workspace]

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
opt-level = "z"
