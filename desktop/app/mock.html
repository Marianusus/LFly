<!doctype html>
<html lang="it"><head><meta charset="UTF-8" /><title>LFly mock</title>
<script>
// Development only: stands in for the Rust core so the window can be looked at in a browser.
// Covers drawn here, so the mock looks like music without the network.
const hues = [[330, 20], [200, 260], [30, 350], [150, 200], [270, 310], [10, 45], [180, 120], [240, 190]];
const art = (i) => {
  const [a, b] = hues[i % hues.length];
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${a},80%,62%)'/><stop offset='1' stop-color='hsl(${b},70%,28%)'/></linearGradient><radialGradient id='r' cx='.3' cy='.3' r='.6'><stop offset='0' stop-color='white' stop-opacity='.45'/><stop offset='1' stop-color='white' stop-opacity='0'/></radialGradient></defs><rect width='100' height='100' fill='url(%23g)'/><circle cx='${30 + (i * 17) % 50}' cy='${35 + (i * 23) % 40}' r='${18 + (i * 7) % 20}' fill='url(%23r)'/><circle cx='70' cy='72' r='${10 + (i * 5) % 14}' fill='hsl(${b},90%,75%)' fill-opacity='.35'/></svg>`;
  return "data:image/svg+xml;utf8," + svg.replace(/#/g, "%23");
};
const track = (i) => ({ id: "yt_" + i, title: ["Get Lucky","Instant Crush","One More Time","Digital Love","Harder, Better"][i % 5], artist: "Daft Punk", album: "Random Access Memories", durationMs: 248000, coverUrl: art(i), provider: "YouTube Music", isVideo: false });
const tracks = Array.from({ length: 12 }, (_, i) => track(i));
const state = { deviceId: "pc", active: true, playing: true, positionMs: 61000, at: Date.now(), durationMs: 248000, index: 0, queue: tracks, shuffle: false, repeat: "off", volume: 70 };
// ?max: the window maximised (square corners).
if (new URLSearchParams(location.search).has("max")) document.documentElement.classList.add("maximized");
if (new URLSearchParams(location.search).has("debug")) setTimeout(() => { const d = document.createElement("div"); d.style.cssText = "position:fixed;left:300px;top:200px;z-index:99999;background:#fff;color:#000;padding:8px;font:16px monospace"; d.textContent = "html class=[" + document.documentElement.className + "] body clip=" + getComputedStyle(document.body).clipPath + " r=" + getComputedStyle(document.body).borderRadius; document.documentElement.appendChild(d); }, 0);
// ?slow: the load event waits 2.5 s (a slow image), so screenshots catch what happens after mount.
if (new URLSearchParams(location.search).has("slow")) document.write('<img src="http://127.0.0.1:1435/x.png" style="position:fixed;width:1px;height:1px;opacity:0">');
// ?probe: after 2 s, prints facts about the panel's veil.
if (new URLSearchParams(location.search).has("probe")) setTimeout(() => { const t = document.querySelector(".lfly-panel .top"), f = t && t.querySelector(".fog"), b = document.querySelector(".lfly-panel .body"); const d = document.createElement("div"); d.style.cssText = "position:fixed;left:300px;top:200px;z-index:99999;background:#fff;color:#000;padding:8px;font:13px monospace;max-width:640px"; d.textContent = t ? `top.class=[${t.className}] h=${t.offsetHeight} fog.op=${f && getComputedStyle(f).opacity} fog.h=${f && f.offsetHeight} body.scrollTop=${b && b.scrollTop} body.pt=${b && getComputedStyle(b).paddingTop}` : "no .top"; document.documentElement.appendChild(d); }, 2000);
// ?scrollpanel: the right panel's list scrolled a little (to see the veil).
if (new URLSearchParams(location.search).has("scrollpanel")) setTimeout(() => { const b = document.querySelector(".lfly-panel .body"); if (b) { b.scrollTop = 120; b.dispatchEvent(new Event("scroll")); } const l = document.querySelector(".lfly-main"); if (l) l.scrollTop = 0; }, 1500);
// ?empty: nothing playing.
if (new URLSearchParams(location.search).has("empty")) Object.assign(state, { playing: false, index: -1, queue: [] });
const card = (kind, i) => ({ kind, id: kind + i, title: kind === "artist" ? "Daft Punk" : "Random Access Memories " + i, subtitle: kind === "artist" ? "Artista" : "Album · 2013", coverUrl: art(i + 3) });
const answers = {
  player_ready: true, player_state: state, connect_me: { id: "pc", name: "Fisoolinux" }, connect_following: null,
  connect_devices: [{ id: "s23", name: "Galaxy S23 Ultra", kind: "phone", sameAccount: true, host: "", port: 1 }, { id: "w", name: "Galaxy Watch", kind: "watch", sameAccount: true, host: "", port: 1 }],
  library_get: { favorites: tracks.slice(0, 5), playlists: [{ id: "p1", name: "Estate 2026", tracks }, { id: "p2", name: "Notte", tracks: tracks.slice(3) }], history: tracks },
  store_get: null,
  yt_home: [{ title: "Ascolto rapido", items: tracks.slice(0, 6).map((t) => ({ kind: "song", id: t.id, title: t.title, subtitle: t.artist, coverUrl: t.coverUrl, track: t })) }, { title: "Album per te", items: [0,1,2,3,4,5,6,7].map((i) => card("album", i)) }, { title: "Artisti che ami", items: [0,1,2,3,4].map((i) => card("artist", i)) }],
  downloads_list: { tracks: [], bytes: 0 },
  // Made-up lines, timed around the mock's position (61 s), each word with its own timing.
  yt_lyrics: (() => {
    const text = ["Luci sulla strada di notte", "Il ritmo che non si ferma", "Ancora un giro, ancora noi", "Le mani alzate verso il cielo", "Tutto brilla quando suoni", "Non spegnere la musica", "Restiamo qui fino all'alba", "Un'altra volta, un'altra volta", "La città canta con noi", "E il tempo si dimentica"];
    const synced = text.map((t, i) => {
      const ms = 44000 + i * 5200, words = t.split(" "), step = 4600 / words.length;
      return { ms, endMs: ms + 4800, text: t, words: words.map((w, j) => ({ ms: ms + j * step, endMs: ms + (j + 1) * step, text: (j ? " " : "") + w })) };
    });
    return { synced, plain: text.join("\n"), source: "BetterLyrics" };
  })(),
  player_devices: [{ id: "alsa:default", name: "Uscita predefinita", isDefault: true }, { id: "alsa:hw", name: "DAC USB", isDefault: false }],
};
const themeId = (location.hash.split("theme=")[1] || "").split("&")[0];
if (themeId) answers.store_get = { activeId: themeId, custom: [] };
let cb = 0;
// Events: the core's listeners are kept, so the mock can send events (window.__emit).
const callbacks = {}, listeners = {};
window.__emit = (event, payload) => (listeners[event] || []).forEach((h) => callbacks[h]?.({ event, id: 0, payload }));
window.__TAURI_INTERNALS__ = {
  metadata: { currentWindow: { label: "main" }, currentWebview: { windowLabel: "main", label: "main" } },
  invoke: async (cmd, args) => {
    if (cmd === "plugin:event|listen") {
      (listeners[args.event] ||= []).push(args.handler);
      return args.handler;
    }
    // mock.html?mode=PURE_WHITE&accent=blue#home: the look to show.
    if (cmd === "store_get" && args?.key === "appearance") {
      const q = new URLSearchParams(location.search);
      return q.get("mode") ? { mode: q.get("mode"), accent: q.get("accent") || "emerald", glass: { enabled: true, lens: true, strength: 0.75 }, customId: null } : null;
    }
    // ?panel=queue|devices opens the right panel, ?narrow folds the sidebar.
    if (cmd === "store_get" && args?.key === "ui") {
      const q = new URLSearchParams(location.search);
      if (q.get("panel") || q.has("narrow")) return { panel: q.get("panel"), sidebarWide: !q.has("narrow") };
    }
    if (cmd === "plugin:window|is_maximized") return new URLSearchParams(location.search).has("max");
    return cmd in answers ? structuredClone(answers[cmd]) : null;
  },
  transformCallback: (f) => {
    callbacks[++cb] = f;
    return cb;
  },
  unregisterCallback: () => {},
  metadata: { currentWindow: { label: "main" }, currentWebview: { label: "main" } },
};
window.__TAURI_EVENT_PLUGIN_INTERNALS__ = { unregisterListener: () => {} };
</script>
</head><body><div id="app"></div>
<script>
// ?delay holds the load event a moment, so a headless screenshot sees the page after its intro.
if (location.search.includes("delay")) document.write('<img src="http://127.0.0.1:1499/wait" alt="" style="display:none">');
</script><script type="module" src="/src/main.ts"></script><script>
// ?pair asks to pair, ?toast shows a notice, ?menu opens the menu on the first song row.
{
  const q = new URLSearchParams(location.search);
  if (q.has("pair")) setTimeout(() => window.__emit("host:event", { kind: "pairRequest", request: 1, deviceName: "Galaxy S23 Ultra", code: "4817" }), 1200);
  if (q.has("toast")) setTimeout(() => window.__emit("player:notice", "Aggiunto alla coda"), 1200);
  if (q.has("menu")) setTimeout(() => {
    const row = document.querySelector(".lfly-row");
    const r = row?.getBoundingClientRect();
    if (r) row.dispatchEvent(new MouseEvent("contextmenu", { bubbles: true, cancelable: true, clientX: r.left + 420, clientY: r.top + 30 }));
  }, 1300);
}
if (location.hash.endsWith("/edit")) {
  const open = setInterval(() => {
    const b = [...document.querySelectorAll(".settings button")].find((x) => x.textContent.includes("Personalizza"));
    if (b) { clearInterval(open); b.click(); }
  }, 100);
}
if (location.hash.includes("theme=")) setTimeout(() => [...document.querySelectorAll(".card")].find((b) => b.textContent.includes(decodeURIComponent(location.hash.split("theme=")[1])))?.click(), 1200);
</script></body></html>
