# LFly for computer, drawn natively with GPUI (no webview). Its own workspace for now, so the
# Tauri app's CI never builds GPUI; it shares the crates under ../crates.
[package]
name = "lfly-native"
version = "0.2.0"
edition = "2021"
license = "GPL-3.0-or-later"

[dev-dependencies]
gpui-pre = { version = "=0.3.12", features = ["test-support"] }
regex = "1"

[[bin]]
name = "lfly"
path = "src/main.rs"

[dependencies]
uuid = { version = "1", features = ["v4"] }
gpui-kit = "=0.9.1"
lfly-yt = { path = "../crates/lfly-yt" }
lfly-core = { path = "../crates/lfly-core" }
lfly-connect = { path = "../crates/lfly-connect" }
lfly-audio = { path = "../crates/lfly-audio" }
lfly-mix = { path = "../crates/lfly-mix" }
raw-window-handle = "0.6"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
tiny-skia = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dirs = "6"
log = "0.4"
env_logger = "0.11"
anyhow = "1"
midir = "0.11.1"
serde = { version = "1", features = ["derive"] }

[workspace]

[patch.crates-io]
opus-decoder = { path = "../crates/lfly-audio/vendor/opus-decoder" }
# GPUI with a Liquid Glass primitive (see vendor/PATCHES.md).
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-wgpu = { path = "vendor/gpui-pre-wgpu" }
gpui-pre-windows = { path = "vendor/gpui-pre-windows" }
gpui-pre-apple = { path = "vendor/gpui-pre-apple" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev.package.opus-decoder]
opt-level = 3
[profile.dev.package.symphonia-core]
opt-level = 3
[profile.dev.package.rubato]
opt-level = 3
[profile.dev.package.image]
opt-level = 3

# The Automix's beat model (ONNX Runtime, linked statically, and the 23 MB Beat This! weights).
# ONNX Runtime ships no build for windows-gnu, the target of the local Windows check: there the
# app builds without it, and Automix falls back to a crossfade.
[target.'cfg(not(all(windows, target_env = "gnu")))'.dependencies]
lfly-core = { path = "../crates/lfly-core", features = ["beat-model"] }
