# LFly for the desktop drawn by GPUI (desktop/native): builds Linux and Windows and keeps the
# binaries as artifacts. Runs by hand, or on pushes that touch the native app.
name: Native desktop

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop/native/**"
      - "desktop/crates/**"
      - ".github/workflows/native.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bin: desktop/native/target/release/lfly
          - os: windows-latest
            bin: desktop/native/target/release/lfly.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libxkbcommon-x11-dev libwayland-dev libfontconfig-dev \
            libfreetype-dev libvulkan-dev libx11-xcb-dev libxcb1-dev libzstd-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/native
      - name: Build
        working-directory: desktop/native
        run: cargo build --release --locked
      - name: Keep the binary
        uses: actions/upload-artifact@v4
        with:
          name: lfly-native-${{ matrix.os }}
          path: ${{ matrix.bin }}
